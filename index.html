  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

larity and calm for the people who carry the care.<\u002Fp>\n      <p style=\"font-size:clamp(16px,1.6vw,19px);line-height:1.65;color:rgba(246,241,233,.86);max-width:52ch;margin:22px 0 0;opacity:0;transform:translateY(24px);transition:opacity 1s cubic-bezier(.22,.61,.36,1),transform 1s cubic-bezier(.22,.61,.36,1);\">When someone you love is unwell, the hardest part isn't the loving — it's the not knowing. Nori stands beside you, so care feels less like a maze and more like a path.<\u002Fp>\n    <\u002Fdiv>\n\n    \n  <\u002Fsection><\u002Fheader>\n\n  <!-- 01 PROBLEM -->\n  <section id=\"problem\" data-screen-label=\"Problem\" style=\"padding:clamp(90px,13vh,150px) 0;background:var(--linen);\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(24px,5vw,56px);\">\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);font-family:'Spline Sans Mono',monospace;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);margin:0;display:inline-flex;align-items:center;gap:9px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"15\" height=\"15\" style=\"flex:0 0 auto;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg>01 — The weight of caring<\u002Fp>\n      <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .06s,transform .95s cubic-bezier(.22,.61,.36,1) .06s;font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.8vw,54px);line-height:1.05;letter-spacing:-.02em;color:var(--evergreen-deep);margin:16px 0 0;max-width:18ch;\">Caring for someone shouldn't mean carrying it alone.<\u002Fh2>\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .12s,transform .95s cubic-bezier(.22,.61,.36,1) .12s;font-size:clamp(17px,2vw,21px);line-height:1.6;color:var(--walnut-soft);max-width:56ch;margin:24px 0 0;\">Behind every patient is someone keeping track — of the medicines, the appointments, the bills, the questions no one had time to answer. The love is never the problem. The overwhelm is.<\u002Fp>\n\n      <div class=\"nori-problem-grid\" style=\"display:grid;gap:16px;margin-top:52px;align-items:start;\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);background:var(--cream);border:1px solid var(--mist);border-radius:20px;padding:26px 22px;box-shadow:0 1px 2px rgba(34,68,59,.05),0 6px 20px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-6px);box-shadow:0 10px 30px rgba(34,68,59,.10);\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--clay);letter-spacing:.1em;\">A<\u002Fspan>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--evergreen-deep);margin:14px 0 8px;\">Scattered information<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--walnut-soft);\">Records live across portals, paperwork, and half-remembered conversations. Nothing sits in one place.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .08s,transform .95s cubic-bezier(.22,.61,.36,1) .08s;background:var(--cream);border:1px solid var(--mist);border-radius:20px;padding:26px 22px;box-shadow:0 1px 2px rgba(34,68,59,.05),0 6px 20px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-6px);box-shadow:0 10px 30px rgba(34,68,59,.10);\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--clay);letter-spacing:.1em;\">B<\u002Fspan>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--evergreen-deep);margin:14px 0 8px;\">Caregiver overwhelm<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--walnut-soft);\">Coordinator, advocate, scheduler, note-taker — a dozen roles at once, and no handbook for any of them.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .16s,transform .95s cubic-bezier(.22,.61,.36,1) .16s;background:var(--cream);border:1px solid var(--mist);border-radius:20px;padding:26px 22px;box-shadow:0 1px 2px rgba(34,68,59,.05),0 6px 20px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-6px);box-shadow:0 10px 30px rgba(34,68,59,.10);\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--clay);letter-spacing:.1em;\">C<\u002Fspan>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--evergreen-deep);margin:14px 0 8px;\">Patients feeling unseen<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--walnut-soft);\">Waiting for a ride, for an answer, for someone to notice — a quiet isolation no one intended.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .24s,transform .95s cubic-bezier(.22,.61,.36,1) .24s;background:var(--cream);border:1px solid var(--mist);border-radius:20px;padding:26px 22px;box-shadow:0 1px 2px rgba(34,68,59,.05),0 6px 20px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-6px);box-shadow:0 10px 30px rgba(34,68,59,.10);\">\n          <span style=\"font-family:'Spline Sans Mono',monospace;font-size:12px;color:var(--clay);letter-spacing:.1em;\">D<\u002Fspan>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:22px;color:var(--evergreen-deep);margin:14px 0 8px;\">Anxious transitions<\u002Fh3>\n          <p style=\"margin:0;font-size:15px;line-height:1.55;color:var(--walnut-soft);\">The uncertain gaps between hospital, home, and the next appointment — where worry lives.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 02 WHAT NORI IS -->\n  <section id=\"what\" data-screen-label=\"What Nori is\" style=\"padding:clamp(90px,14vh,160px) 0;background:var(--cream);border-top:1px solid var(--mist);\">\n    <div style=\"max-width:900px;margin:0 auto;padding:0 clamp(24px,5vw,56px);text-align:center;\">\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);font-family:'Spline Sans Mono',monospace;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);margin:0;display:inline-flex;align-items:center;gap:9px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"15\" height=\"15\" style=\"flex:0 0 auto;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg>02 — What Nori is<\u002Fp>\n      <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .06s,transform .95s cubic-bezier(.22,.61,.36,1) .06s;font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.8vw,52px);line-height:1.08;letter-spacing:-.02em;color:var(--evergreen-deep);margin:18px auto 0;max-width:20ch;\">A companion for the care journey — not another system to manage.<\u002Fh2>\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .12s,transform .95s cubic-bezier(.22,.61,.36,1) .12s;font-size:clamp(17px,2vw,21px);line-height:1.65;color:var(--walnut-soft);max-width:56ch;margin:26px auto 0;\">Nori isn't a chart or a portal. It's a calmer way to move through care — gathering the scattered pieces into one clear picture, and standing beside families in the moments that feel heaviest.<\u002Fp>\n\n      <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:52px;text-align:left;\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);background:var(--sage);border-radius:18px;padding:26px 30px;\">\n          <p style=\"margin:0;font-size:clamp(16px,1.9vw,18px);line-height:1.6;color:var(--evergreen-deep);\"><strong style=\"font-weight:700;\">One clear picture.<\u002Fstrong> <span style=\"color:var(--walnut);\">Everything about a person's care, brought together — so nothing important slips through.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .1s,transform .95s cubic-bezier(.22,.61,.36,1) .1s;background:var(--sky);border-radius:18px;padding:26px 30px;\">\n          <p style=\"margin:0;font-size:clamp(16px,1.9vw,18px);line-height:1.6;color:var(--evergreen-deep);\"><strong style=\"font-weight:700;\">Language you can act on.<\u002Fstrong> <span style=\"color:var(--walnut);\">Confusion turned into plain, human words — the kind that help you decide what to do next.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .2s,transform .95s cubic-bezier(.22,.61,.36,1) .2s;background:var(--honey);border-radius:18px;padding:26px 30px;\">\n          <p style=\"margin:0;font-size:clamp(16px,1.9vw,18px);line-height:1.6;color:var(--evergreen-deep);\"><strong style=\"font-weight:700;\">Steady, together.<\u002Fstrong> <span style=\"color:#6b5a2e;\">A family holding the same understanding — sharing the load instead of the worry.<\u002Fspan><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 03 APP DEMO -->\n  <section id=\"demo\" data-screen-label=\"App demo\" style=\"min-height:100dvh;box-sizing:border-box;display:flex;align-items:center;padding:clamp(88px,11vh,120px) 0 clamp(56px,7vh,80px);background:radial-gradient(900px 520px at 82% -5%,rgba(199,217,204,.4),transparent 60%),#EAF1EC;border-top:1px solid var(--mist);overflow:hidden;\">\n    <div style=\"width:100%;max-width:1120px;margin:0 auto;padding:0 clamp(24px,5vw,56px);display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(32px,5vw,64px);align-items:center;\">\n      <div class=\"nori-demo-copy\">\n        <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .06s,transform .95s cubic-bezier(.22,.61,.36,1) .06s;font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.6vw,50px);line-height:1.06;letter-spacing:-.02em;color:var(--evergreen-deep);margin:16px 0 0;max-width:15ch;\">A calmer place to stand — right in your hand.<\u002Fh2>\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .12s,transform .95s cubic-bezier(.22,.61,.36,1) .12s;font-size:clamp(17px,2vw,20px);line-height:1.6;color:var(--walnut-soft);max-width:46ch;margin:22px 0 0;\">This is Nori, working. Move through the preview at your own pace — it's fully interactive.<\u002Fp>\n        <div class=\"nori-demo-checklist\" data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .18s,transform .95s cubic-bezier(.22,.61,.36,1) .18s;display:flex;flex-direction:column;gap:14px;margin-top:32px;\">\n          <div style=\"display:flex;align-items:flex-start;gap:12px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-size:15.5px;line-height:1.5;color:var(--walnut);\"><strong style=\"color:var(--evergreen-deep);font-weight:700;\">Log<\u002Fstrong> a symptom, and see gently what it means.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-size:15.5px;line-height:1.5;color:var(--walnut);\"><strong style=\"color:var(--evergreen-deep);font-weight:700;\">Decode<\u002Fstrong> a confusing bill into plain words.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:flex-start;gap:12px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"18\" height=\"18\" style=\"flex:0 0 auto;margin-top:2px;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg><span style=\"font-size:15.5px;line-height:1.5;color:var(--walnut);\"><strong style=\"color:var(--evergreen-deep);font-weight:700;\">Ask Nori<\u002Fstrong> — for what to watch, or what to say next.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"https://docs.google.com/forms/d/e/1FAIpQLSf7h5BFBCi-jWnjUcNC04UiuwWjzE48_P67Ugqytndk7O8lVg/viewform?usp=publish-editor\" target=\"_blank\" rel=\"noopener\" data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .24s,transform .95s cubic-bezier(.22,.61,.36,1) .24s;display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:30px;text-decoration:none;background:var(--evergreen);color:#fff;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px;border-radius:14px;padding:15px 24px;box-shadow:0 6px 18px rgba(34,68,59,.18);transition-property:opacity,transform,background;\" style-hover=\"background:var(--evergreen-deep);\">\n          <svg sc-camel-view-box=\"0 0 100 100\" width=\"17\" height=\"17\" style=\"flex:0 0 auto;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#C7D9CC\"><\u002Fpath><g stroke=\"#22443B\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg>\n          Share your feedback\n        <\u002Fa>\n      <\u002Fdiv>\n\n      <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.22,.61,.36,1),transform 1s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;align-items:center;gap:18px;\">\n        <div style=\"width:100%;max-width:352px;margin:0 auto;height:min(686px,80vh);border-radius:32px;overflow:hidden;background:var(--linen);border:1px solid rgba(47,93,80,.14);box-shadow:0 30px 70px rgba(34,68,59,.18);\">\n          <iframe id=\"demo-frame\" title=\"Nori — interactive app preview\" style=\"width:100%;height:100%;border:none;display:block;background:var(--linen);\"><\u002Fiframe>\n        <\u002Fdiv>\n        <button id=\"demo-expand\" type=\"button\" style=\"display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--evergreen-deep);background:rgba(255,255,255,.7);border:1px solid rgba(47,93,80,.2);border-radius:999px;padding:11px 20px;transition:background .25s,border-color .25s;\" style-hover=\"background:#fff;border-color:rgba(47,93,80,.42);\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 3H3v6M15 3h6v6M9 21H3v-6M15 21h6v-6\"><\u002Fpath><\u002Fsvg>\n          View full screen\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 04 EXPERIENCE -->\n  <section id=\"experience\" data-screen-label=\"Experience\" style=\"padding:clamp(90px,13vh,150px) 0;background:var(--linen);border-top:1px solid var(--mist);\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(24px,5vw,56px);\">\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);font-family:'Spline Sans Mono',monospace;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);margin:0;display:inline-flex;align-items:center;gap:9px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"15\" height=\"15\" style=\"flex:0 0 auto;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#2F5D50\"><\u002Fpath><g stroke=\"#C7D9CC\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg>04 — What it feels like<\u002Fp>\n      <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .06s,transform .95s cubic-bezier(.22,.61,.36,1) .06s;font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,4.8vw,52px);line-height:1.06;letter-spacing:-.02em;color:var(--evergreen-deep);margin:16px 0 0;\">Three quiet promises.<\u002Fh2>\n\n      <div class=\"nori-promises\" style=\"display:grid;gap:clamp(14px,1.6vw,20px);margin-top:52px;\">\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);background:var(--cream);border:1px solid var(--mist);border-radius:24px;padding:clamp(24px,2.8vw,34px) clamp(20px,2.3vw,30px) clamp(26px,3vw,38px);box-shadow:0 1px 2px rgba(34,68,59,.05),0 8px 24px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-8px);box-shadow:0 16px 40px rgba(34,68,59,.12);\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:15px;color:var(--evergreen);letter-spacing:.1em;\">01<\u002Fdiv>\n          <div style=\"width:46px;height:4px;border-radius:2px;background:var(--sage);margin:18px 0 22px;\"><\u002Fdiv>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--evergreen-deep);margin:0 0 12px;\">Stay informed<\u002Fh3>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:var(--walnut-soft);\">Everything about their care, gathered into one clear place — so you always know where things stand, without hunting for it.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .1s,transform .95s cubic-bezier(.22,.61,.36,1) .1s;background:var(--cream);border:1px solid var(--mist);border-radius:24px;padding:clamp(24px,2.8vw,34px) clamp(20px,2.3vw,30px) clamp(26px,3vw,38px);box-shadow:0 1px 2px rgba(34,68,59,.05),0 8px 24px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-8px);box-shadow:0 16px 40px rgba(34,68,59,.12);\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:15px;color:var(--evergreen);letter-spacing:.1em;\">02<\u002Fdiv>\n          <div style=\"width:46px;height:4px;border-radius:2px;background:var(--sky);margin:18px 0 22px;\"><\u002Fdiv>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--evergreen-deep);margin:0 0 12px;\">Stay connected<\u002Fh3>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:var(--walnut-soft);\">Family and the people helping, all on the same page — sharing what needs doing, instead of each carrying the worry alone.<\u002Fp>\n        <\u002Fdiv>\n        <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .2s,transform .95s cubic-bezier(.22,.61,.36,1) .2s;background:var(--cream);border:1px solid var(--mist);border-radius:24px;padding:clamp(24px,2.8vw,34px) clamp(20px,2.3vw,30px) clamp(26px,3vw,38px);box-shadow:0 1px 2px rgba(34,68,59,.05),0 8px 24px rgba(34,68,59,.05);\" style-hover=\"transform:translateY(-8px);box-shadow:0 16px 40px rgba(34,68,59,.12);\">\n          <div style=\"font-family:'Spline Sans Mono',monospace;font-size:15px;color:var(--evergreen);letter-spacing:.1em;\">03<\u002Fdiv>\n          <div style=\"width:46px;height:4px;border-radius:2px;background:var(--honey);margin:18px 0 22px;\"><\u002Fdiv>\n          <h3 style=\"font-family:'Fraunces',serif;font-weight:600;font-size:27px;color:var(--evergreen-deep);margin:0 0 12px;\">Stay supported<\u002Fh3>\n          <p style=\"margin:0;font-size:15.5px;line-height:1.6;color:var(--walnut-soft);\">A steady presence for the hard moments — answers when you need them, and calm for the times you don't have the words.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- 05 FOUNDER STORY -->\n  <section id=\"founder\" data-screen-label=\"Founder story\" style=\"padding:clamp(96px,15vh,170px) 0;background:var(--evergreen-deep);color:var(--linen);position:relative;overflow:hidden;\">\n    <div data-orb=\"\" style=\"position:absolute;top:-10%;right:-8%;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,var(--evergreen),transparent 70%);opacity:.5;filter:blur(80px);pointer-events:none;\"><\u002Fdiv>\n    \n  <div style=\"position:relative;z-index:2;max-width:940px;margin:0 auto;padding:0 clamp(24px,5vw,56px);\">\n\n      <div id=\"founder-media-wrap\" data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity 1s cubic-bezier(.22,.61,.36,1),transform 1s cubic-bezier(.22,.61,.36,1);float:left;width:clamp(200px,30%,260px);margin:8px clamp(26px,3.4vw,44px) 18px 0;\">\n        <div id=\"founder-media\" style=\"position:relative;\">\n          <div style=\"position: absolute; inset: 14px -14px -14px 14px; border: 1px solid rgba(199,217,204,.4); border-radius: 20px; height: 300px\"><\u002Fdiv>\n          <div style=\"position:relative;border-radius:18px;overflow:hidden;box-shadow:0 24px 56px rgba(0,0,0,.35);border:1px solid rgba(199,217,204,.25);\">\n            \n          <img src=\"153b7351-9220-4cbe-98bb-5d1d85728d85\" alt=\"Founder of Nori\" loading=\"lazy\" decoding=\"async\" width=\"900\" height=\"563\" style=\"display: block; height: 300px; position: static; object-fit: contain; overflow: visible; transform: translate(-162px, 0px) scale(1.2)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div>\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);font-family:'Spline Sans Mono',monospace;font-size:12.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--honey);margin:0;display:inline-flex;align-items:center;gap:9px;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"15\" height=\"15\" style=\"flex:0 0 auto;\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#C7D9CC\"><\u002Fpath><g stroke=\"#22443B\" stroke-width=\"4.4\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg>05 — Why Nori exists<\u002Fp>\n        <h2 data-reveal=\"\" style=\"opacity: 0; transform: translateY(30px); transition: opacity .95s cubic-bezier(.22,.61,.36,1) .06s,transform .95s cubic-bezier(.22,.61,.36,1) .06s; font-family: 'Fraunces',serif; font-weight: 600; font-size: clamp(28px,3.8vw,44px); line-height: 1.1; letter-spacing: -.02em; color: #fff; margin: 16px 0 0\">It began with a question we couldn't answer.<\u002Fh2>\n\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .1s,transform .95s cubic-bezier(.22,.61,.36,1) .1s;font-size:17px;line-height:1.72;color:rgba(246,241,233,.85);margin:26px 0 0;\">A couple of months ago, I lost my uncle. In the weeks that followed, what stayed with me most wasn't only the grief — it was watching the people who had cared for him turn the same thought over and over.<\u002Fp>\n\n        <blockquote data-reveal=\"\" style=\"opacity: 0; transform: translateY(30px); transition: opacity .95s cubic-bezier(.22,.61,.36,1) .16s,transform .95s cubic-bezier(.22,.61,.36,1) .16s; margin: 30px 0; border-left: 3px solid var(--honey); font-family: 'Fraunces',serif; font-style: italic; font-weight: 400; font-size: clamp(22px,3vw,30px); line-height: 1.3; color: var(--sage); padding-left: 22px; overflow: hidden;\">\"What else could I have done?\"<\u002Fblockquote>\n\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .2s,transform .95s cubic-bezier(.22,.61,.36,1) .2s;font-size:17px;line-height:1.72;color:rgba(246,241,233,.85);margin:0 0 18px;\">That regret, I came to understand, wasn't a failure of love. It was a failure of clarity — they had given everything they had, inside a system that rarely made it easy to know whether it was enough.<\u002Fp>\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .24s,transform .95s cubic-bezier(.22,.61,.36,1) .24s;font-size:17px;line-height:1.72;color:rgba(246,241,233,.85);margin:0 0 18px;\">It took me back to the year before, when I'd spent time observing clinical trials. I kept returning to what I'd seen in those rooms — patients waiting for a ride, for an answer, for someone to notice them. People who felt like a case number in the middle of their own care.<\u002Fp>\n        <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .28s,transform .95s cubic-bezier(.22,.61,.36,1) .28s;font-size:17px;line-height:1.72;color:#fff;margin:0;\">Somewhere between those two experiences — my family's regret and those quiet clinical rooms — I began thinking about how I could help. Nori is what took shape: a way for patients to feel seen and supported, for families to act with clarity and confidence, and for fewer people to be left asking the question mine couldn't put down.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv><\u002Fsection>\n\n  <!-- 05 CLOSING -->\n  <section id=\"closing\" data-screen-label=\"Closing\" style=\"padding:clamp(96px,16vh,180px) 0;background:var(--linen);text-align:center;position:relative;overflow:hidden;\">\n    <div data-orb=\"\" style=\"position:absolute;bottom:-20%;left:50%;transform:translateX(-50%);width:760px;height:520px;border-radius:50%;background:radial-gradient(circle,rgba(199,217,204,.5),transparent 70%);opacity:.5;filter:blur(80px);pointer-events:none;\"><\u002Fdiv>\n    <div style=\"position:relative;z-index:2;max-width:760px;margin:0 auto;padding:0 clamp(24px,5vw,56px);\">\n      <div data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1),transform .95s cubic-bezier(.22,.61,.36,1);display:flex;justify-content:center;align-items:center;gap:11px;margin-bottom:26px;\">\n        <span style=\"width:44px;height:44px;border-radius:13px;background:var(--evergreen);display:grid;place-items:center;\"><svg sc-camel-view-box=\"0 0 100 100\" width=\"28\" height=\"28\" aria-hidden=\"true\"><path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#FBF8F4\"><\u002Fpath><g stroke=\"#2F5D50\" stroke-width=\"3.6\" stroke-linecap=\"round\" fill=\"none\"><path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath><path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath><\u002Fg><\u002Fsvg><\u002Fspan>\n      <\u002Fdiv>\n      <h2 data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .1s,transform .95s cubic-bezier(.22,.61,.36,1) .1s;font-family:'Fraunces',serif;font-weight:600;font-size:clamp(30px,5vw,56px);line-height:1.08;letter-spacing:-.02em;color:var(--evergreen-deep);margin:0;\">Nori is built for families navigating care together.<\u002Fh2>\n      <p data-reveal=\"\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .16s,transform .95s cubic-bezier(.22,.61,.36,1) .16s;font-size:clamp(17px,2vw,20px);line-height:1.6;color:var(--walnut-soft);max-width:46ch;margin:26px auto 0;\">No noise, no pressure. Just a calmer place to stand when someone you love needs you.<\u002Fp>\n\n      <form data-reveal=\"\" onsubmit=\"{{ onSubmit }}\" style=\"opacity:0;transform:translateY(30px);transition:opacity .95s cubic-bezier(.22,.61,.36,1) .22s,transform .95s cubic-bezier(.22,.61,.36,1) .22s;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:38px;\">\n        <input type=\"email\" required=\"\" placeholder=\"your email\" aria-label=\"Email address\" style=\"flex:1 1 260px;max-width:320px;border:1px solid var(--mist);background:var(--cream);border-radius:14px;padding:15px 18px;font-family:'Hanken Grotesk',sans-serif;font-size:15px;color:var(--walnut);\">\n        <button type=\"submit\" style=\"border:none;background:var(--evergreen);color:#fff;border-radius:14px;padding:15px 26px;font-family:'Hanken Grotesk',sans-serif;font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 6px 18px rgba(34,68,59,.18);transition:background .25s,transform .15s;\" style-hover=\"background:var(--evergreen-deep);\" style-active=\"transform:scale(.98);\">Stay in touch<\u002Fbutton>\n      <\u002Fform>\n      <p id=\"closing-note\" style=\"font-size:13px;color:var(--walnut-soft);margin:16px 0 0;min-height:18px;\">{{ note }}<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer style=\"background:var(--evergreen-deep);color:rgba(199,217,204,.8);padding:56px 0 44px;text-align:center;\">\n    <div style=\"max-width:1120px;margin:0 auto;padding:0 clamp(24px,5vw,56px);\">\n      <div style=\"display:inline-flex;align-items:center;gap:12px;\">\n        <svg sc-camel-view-box=\"0 0 100 100\" width=\"40\" height=\"40\" role=\"img\" aria-label=\"Nori\">\n          <path d=\"M 50 84.5 C 26.6 60.5 22.4 36.5 36.2 33.2 C 44 30.8 50 39.2 50 45.2 C 50 39.2 56 30.8 63.8 33.2 C 77.6 36.5 73.4 60.5 50 84.5 Z\" fill=\"#FBF8F4\"><\u002Fpath>\n          <g stroke=\"#2F5D50\" stroke-width=\"3.4\" stroke-linecap=\"round\" fill=\"none\">\n            <path d=\"M 50 41 L 50 80.6\"><\u002Fpath><path d=\"M 50 52.4 L 62.6 41\"><\u002Fpath><path d=\"M 50 52.4 L 37.4 41\"><\u002Fpath>\n            <path d=\"M 50 65 L 60.2 56.6\"><\u002Fpath><path d=\"M 50 65 L 39.8 56.6\"><\u002Fpath>\n          <\u002Fg>\n        <\u002Fsvg>\n        <span style=\"font-family:'Fraunces',serif;color:#fff;font-size:26px;font-weight:600;\">Nori<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-family:'Fraunces',serif;font-style:italic;color:var(--sage);margin:12px 0 0;font-size:17px;\">Healthcare, organized for those who care.<\u002Fp>\n      <p style=\"font-size:12.5px;color:rgba(199,217,204,.5);margin:26px auto 0;max-width:52ch;line-height:1.6;\">A caregiving companion — not a medical device, and never a substitute for a care team. In an emergency, call 911.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n  <!-- Fullscreen demo overlay -->\n  <div id=\"demo-lightbox\" role=\"dialog\" aria-modal=\"true\" aria-label=\"Nori app — full screen preview\" style=\"position:fixed;inset:0;z-index:200;display:none;opacity:0;transition:opacity .3s ease;background:rgba(22,40,35,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:clamp(16px,3vh,32px);box-sizing:border-box;flex-direction:column;align-items:center;gap:14px;\">\n    <button id=\"demo-lightbox-close\" type=\"button\" aria-label=\"Close full screen preview\" style=\"align-self:flex-end;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-family:'Hanken Grotesk',sans-serif;font-weight:600;font-size:14px;color:var(--evergreen-deep);background:var(--linen);border:none;border-radius:999px;padding:11px 20px;box-shadow:0 8px 24px rgba(0,0,0,.2);\">\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 5l14 14M19 5L5 19\"><\u002Fpath><\u002Fsvg>\n      Close\n    <\u002Fbutton>\n    <div style=\"flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;\">\n      <div style=\"width:min(430px,100%);height:100%;max-height:100%;border-radius:28px;overflow:hidden;background:var(--linen);box-shadow:0 40px 90px rgba(0,0,0,.35);\">\n        <iframe id=\"demo-frame-full\" title=\"Nori — full screen app preview\" style=\"width:100%;height:100%;border:none;display:block;background:var(--linen);\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { note: \"\" };\n\n  renderVals() {\n    return {\n      note: this.state.note,\n      onSubmit: (e) => {\n        e.preventDefault();\n        this.setState({ note: \"Thank you — we'll be in touch, gently.\" });\n      },\n    };\n  }\n\n  componentDidMount() {\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    const reveals = () => Array.from(document.querySelectorAll('[data-reveal]'));\n    const heroKids = () => Array.from(document.querySelectorAll('#hero-inner > *'));\n\n    // Bypass CSS transitions entirely when forcing an element to its resting\n    // state: a transitioned opacity/transform change only reaches its target\n    // once the browser has serviced paint frames for it, which some contexts\n    // (backgrounded/hidden tabs, automated checks) never do — that would leave\n    // the element frozen mid-transition. Turning transition off makes the\n    // change a plain, synchronous style recalculation instead, so the final\n    // value is guaranteed correct immediately, in every context.\n    const hardSet = (el) => {\n      el.style.transition = 'none';\n      el.style.opacity = '1';\n      el.style.transform = 'none';\n      void el.offsetWidth; // flush\n    };\n    const showAll = () => { reveals().forEach(hardSet); heroKids().forEach(hardSet); };\n\n    if (reduce) { showAll(); return; }\n\n    // Scroll-reveal via IntersectionObserver (reliable, no CDN dependency).\n    // The nice fade/slide plays via the element's own transition; a delayed\n    // hardSet() right after just guarantees it lands correctly no matter what.\n    if ('IntersectionObserver' in window) {\n      const io = new IntersectionObserver((entries) => {\n        entries.forEach(en => {\n          if (en.isIntersecting) {\n            en.target.style.opacity = '1';\n            en.target.style.transform = 'none';\n            setTimeout(() => hardSet(en.target), 1300);\n            io.unobserve(en.target);\n          }\n        });\n      }, { threshold: 0.12, rootMargin: '0px 0px -8% 0px' });\n      reveals().forEach(el => io.observe(el));\n      setTimeout(showAll, 3500); // safety net\n    } else {\n      showAll();\n    }\n\n    // Nav appearance on scroll\n    const nav = document.getElementById('nori-nav');\n    const ind = document.getElementById('scroll-ind');\n    const onScroll = () => {\n      const y = window.scrollY || window.pageYOffset || 0;\n      if (nav) {\n        if (y > 48) {\n          nav.style.background = 'rgba(246,241,233,.88)';\n          nav.style.backdropFilter = 'blur(12px)';\n          nav.style.webkitBackdropFilter = 'blur(12px)';\n          nav.style.boxShadow = '0 1px 0 rgba(34,68,59,.08)';\n          nav.style.color = 'var(--evergreen-deep)';\n        } else {\n          nav.style.background = 'transparent';\n          nav.style.backdropFilter = 'none';\n          nav.style.webkitBackdropFilter = 'none';\n          nav.style.boxShadow = 'none';\n          nav.style.color = '#fff';\n        }\n      }\n      if (ind) ind.style.opacity = y > 140 ? '0' : '0.85';\n    };\n    window.addEventListener('scroll', onScroll, { passive: true });\n    onScroll();\n\n    // Reveal hero content on load (static resting values, throttle/snapshot-safe)\n    requestAnimationFrame(() => setTimeout(() => {\n      const kids = heroKids();\n      kids.forEach((el, i) => {\n        el.style.transitionDelay = (0.06 + i * 0.09) + 's';\n        el.style.opacity = '1';\n        el.style.transform = 'none';\n      });\n      // Guarantee the resting state lands even if the transition never gets\n      // to paint (see hardSet above).\n      setTimeout(() => kids.forEach(hardSet), 1600);\n    }, 50));\n\n    // Load the interactive prototype into the demo iframe via srcdoc\n    // (relative iframe src doesn't resolve in this runtime, but fetch does).\n    // Deferred: the prototype is a whole second app. Fetching + parsing it during\n    // first paint is what stalls mobile Safari, so wait until the demo is near.\n    const frame = document.getElementById('demo-frame');\n    const loadApp = () => {\n      if (this._appLoading) return Promise.resolve(this._appHtml);\n      this._appLoading = true;\n      return fetch(window.__resources && window.__resources.noriApp ? window.__resources.noriApp : 'nori-app.html')\n        .then(r => r.text())\n        .then(html => { this._appHtml = html; if (frame && !frame.srcdoc) frame.srcdoc = html; return html; })\n        .catch(() => { if (frame) frame.src = 'nori-app.html'; });\n    };\n    this._loadApp = loadApp;\n    if (frame) {\n      const demoSection = document.getElementById('demo');\n      if ('IntersectionObserver' in window && demoSection) {\n        const io = new IntersectionObserver((entries) => {\n          if (entries.some(e => e.isIntersecting)) { io.disconnect(); loadApp(); }\n        }, { rootMargin: '600px 0px' });\n        io.observe(demoSection);\n      } else {\n        loadApp();\n      }\n    }\n\n    // Fullscreen demo overlay\n    const lb = document.getElementById('demo-lightbox');\n    const lbFrame = document.getElementById('demo-frame-full');\n    const expandBtn = document.getElementById('demo-expand');\n    const lbCloseBtn = document.getElementById('demo-lightbox-close');\n    const openLb = () => {\n      if (!lb) return;\n      if (lbFrame && !lbFrame.srcdoc) {\n        if (this._appHtml) lbFrame.srcdoc = this._appHtml;\n        else if (this._loadApp) this._loadApp().then(html => { if (html) lbFrame.srcdoc = html; });\n      }\n      lb.style.display = 'flex';\n      requestAnimationFrame(() => { lb.style.opacity = '1'; });\n      document.body.style.overflow = 'hidden';\n    };\n    const closeLb = () => {\n      if (!lb) return;\n      lb.style.opacity = '0';\n      setTimeout(() => { lb.style.display = 'none'; }, 300);\n      document.body.style.overflow = '';\n    };\n    if (expandBtn) expandBtn.addEventListener('click', openLb);\n    if (lbCloseBtn) lbCloseBtn.addEventListener('click', closeLb);\n    if (lb) lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });\n    document.addEventListener('keydown', e => { if (e.key === 'Escape' && lb && lb.style.display === 'flex') closeLb(); });\n\n    // Progressive enhancement: Lenis smooth scroll + GSAP parallax\n    const idle = window.requestIdleCallback || (fn => setTimeout(fn, 200));\n    idle(() => this._boot(0));\n\n    // Mobile drawer open/close — drive inline styles directly (robust to re-renders)\n    const drawer = document.getElementById('nori-drawer');\n    const burger = document.getElementById('nori-burger');\n    const panel = drawer && drawer.querySelector('.nori-panel');\n    // Toggle a class on <body> (React never manages body, so it survives re-renders).\n    // Slide the panel with the Web Animations API, which runs above style recalc and\n    // isn't disturbed by the runtime's frequent re-renders (CSS transitions get stuck).\n    const EASE = 'cubic-bezier(.22,.61,.36,1)';\n    const openDrawer = () => {\n      document.body.classList.add('nori-menu-open');\n      if (burger) burger.setAttribute('aria-expanded', 'true');\n      document.body.style.overflow = 'hidden';\n      // Slide-in flourish. The open resting state is held by the body-class\n      // !important rule, so the drawer stays open even if this animation is cut short.\n      if (panel && panel.animate) {\n        panel.animate([{ transform: 'translateX(100%)' }, { transform: 'translateX(0)' }],\n          { duration: 420, easing: EASE });\n      }\n    };\n    const closeDrawer = () => {\n      // Instant, bulletproof close: dropping the class returns the guaranteed\n      // closed resting state (WAAPI out-slides get cancelled by re-renders here).\n      document.body.classList.remove('nori-menu-open');\n      if (burger) burger.setAttribute('aria-expanded', 'false');\n      document.body.style.overflow = '';\n    };\n    if (burger) burger.addEventListener('click', openDrawer);\n    const closeBtn = document.getElementById('nori-drawer-close');\n    const overlay = document.getElementById('nori-drawer-overlay');\n    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);\n    if (overlay) overlay.addEventListener('click', closeDrawer);\n    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });\n\n    // Drawer links: close, then smooth-scroll to target\n    document.querySelectorAll('[data-drawerlink]').forEach(a => {\n      a.addEventListener('click', (e) => {\n        const id = a.getAttribute('data-drawerlink');\n        const t = document.getElementById(id);\n        e.preventDefault();\n        closeDrawer();\n        if (!t) return;\n        setTimeout(() => {\n          const top = t.getBoundingClientRect().top + (window.scrollY || window.pageYOffset);\n          if (this._lenis) this._lenis.scrollTo(top, { duration: 0.9 });\n          else window.scrollTo({ top, behavior: 'smooth' });\n        }, 260);\n      });\n    });\n\n    // Smooth anchor navigation\n    document.querySelectorAll('[data-scrollto]').forEach(a => {\n      a.addEventListener('click', (e) => {\n        const id = a.getAttribute('data-scrollto');\n        const t = document.getElementById(id);\n        if (!t) return;\n        e.preventDefault();\n        const top = t.getBoundingClientRect().top + (window.scrollY || window.pageYOffset) - (id === 'top' ? 0 : 0);\n        if (this._lenis) this._lenis.scrollTo(top, { duration: 0.9 });\n        else window.scrollTo({ top, behavior: 'smooth' });\n      });\n    });\n  }\n\n  _boot(tries) {\n    // Touch devices keep native scrolling. Lenis' rAF loop hijacks iOS momentum\n    // scroll and the scrubbed parallax repaints the hero every frame — together\n    // they are the source of the slow, sticky feel on iPhones/iPads.\n    const coarse = window.matchMedia && (window.matchMedia('(hover:none)').matches || window.matchMedia('(pointer:coarse)').matches);\n    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n    if (coarse || reduce) return;\n    if (!tries && !window.gsap) {\n      ['https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js',\n       'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js',\n       'https://unpkg.com/lenis@1.1.14/dist/lenis.min.js'].forEach(src => {\n        if (document.querySelector('script[src=\"' + src + '\"]')) return;\n        const s = document.createElement('script');\n        s.src = src; s.async = false;\n        document.head.appendChild(s);\n      });\n    }\n    if (window.gsap && window.ScrollTrigger) {\n      const gsap = window.gsap;\n      gsap.registerPlugin(window.ScrollTrigger);\n\n      if (window.Lenis) {\n        const lenis = new window.Lenis({ lerp: 0.12, wheelMultiplier: 1, smoothWheel: true, syncTouch: false });\n        this._lenis = lenis;\n        document.documentElement.style.scrollBehavior = 'auto';\n        lenis.on('scroll', window.ScrollTrigger.update);\n        gsap.ticker.add((t) => lenis.raf(t * 1000));\n        gsap.ticker.lagSmoothing(0);\n      }\n\n      // Hero orb parallax\n      gsap.utils.toArray('#hero [data-orb]').forEach((o, i) => {\n        gsap.to(o, {\n          yPercent: i % 2 ? 22 : -16, ease: 'none',\n          scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: true }\n        });\n      });\n      // Hero content drift + fade\n      gsap.to('#hero-inner', {\n        y: -70, opacity: 0.3, ease: 'none',\n        scrollTrigger: { trigger: '#hero', start: 'top top', end: 'bottom top', scrub: true }\n      });\n      return;\n    }\n    if (tries < 45) setTimeout(() => this._boot(tries + 1), 140);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
